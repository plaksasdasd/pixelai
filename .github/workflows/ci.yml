name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: Compile all Python files
        run: python -m compileall -q app.py train.py generate.py utils data models

      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run unit tests
        run: pytest -q tests
